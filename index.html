<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alabanza Ministerio Jerico</title>
    <link rel="manifest" href="manifest.webmanifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        :root {
            --primary: #8b5a2b;
            --bg: #fdfbf7;
        }
        
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .bg-primary-theme { background-color: var(--primary) !important; }
        .text-primary-theme { color: var(--primary) !important; }
        .border-primary-theme { border-color: var(--primary) !important; }
        
        #poster-preview {
            background-color: var(--bg);
            color: #333;
            width: 1000px; 
            padding: 40px;
            box-sizing: border-box;
            position: relative;
            transform-origin: top left;
        }
        
        .poster-header-text {
            color: var(--primary);
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .poster-box {
            border: 2px solid var(--primary);
            border-radius: 12px;
            padding: 20px;
            background: #fff;
            position: relative;
            margin-top: 25px;
            height: 100%;
        }
        
        .box-title {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            padding: 8px 20px;
            border-radius: 20px;
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 1.2rem;
            text-transform: uppercase;
        }
        
        .date-box {
            border: 2px solid var(--primary);
            opacity: 0.8;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            background: var(--bg);
        }
        
        .role-list {
            list-style: none;
            padding: 0;
            margin-top: 15px;
            font-size: 1.1rem;
        }
        
        .role-list li {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            line-height: 1.3;
        }
        
        .role-label {
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 6px;
            flex-shrink: 0;
        }
        
        .role-value {
            word-break: break-word;
            white-space: pre-wrap;
        }
        
        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
        
        .bottom-logo {
            width: 180px;
            height: 180px;
            display: block;
            margin: 40px auto 0 auto;
        }
    </style>
</head>
<body class="text-gray-800">

    <div id="error-banner" class="hidden bg-red-500 text-white p-4 font-bold text-sm z-50 fixed top-0 left-0 right-0 shadow-lg"></div>

    <!-- Datalist for Team Member Auto-Complete -->
    <datalist id="team-directory-list"></datalist>

    <header class="bg-primary-theme text-white p-4 shadow-md flex items-center justify-between sticky top-0 z-40">
        <div class="flex items-center">
            <img src="7007.png" alt="Logo" class="w-12 h-12 rounded-full mr-3 bg-black object-contain" onerror="this.style.display='none'">
            <div>
                <h1 class="font-bold text-lg leading-tight" id="app-title">ALABANZA MINISTERIO JERICO</h1>
                <p class="text-xs opacity-90" data-i18n="SUBTITLE">Creador de anuncios semanales</p>
            </div>
        </div>
        <button onclick="toggleSettings()" class="text-2xl font-bold px-2 py-1 focus:outline-none" type="button">&#8942;</button>
    </header>

    <!-- Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-sm p-6 relative">
            <h2 class="font-bold text-xl mb-4 text-primary-theme" data-i18n="SETTINGS">Configuración</h2>
            
            <div class="space-y-4 text-sm font-semibold">
                <div class="flex justify-between items-center">
                    <label data-i18n="COLOR_THEME">Color Principal:</label>
                    <input type="color" id="set-primary" value="#8b5a2b" onchange="applySettings()" class="w-10 h-10 p-0 border-0 rounded cursor-pointer">
                </div>
                <div class="flex justify-between items-center">
                    <label data-i18n="COLOR_BG">Color de Fondo:</label>
                    <input type="color" id="set-bg" value="#fdfbf7" onchange="applySettings()" class="w-10 h-10 p-0 border-0 rounded cursor-pointer">
                </div>
                <div>
                    <label class="block mb-1" data-i18n="LANG">Idioma / Language:</label>
                    <select id="set-lang" onchange="applySettings()" class="w-full border rounded p-2">
                        <option value="es">Español</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div>
                    <label class="block mb-1" data-i18n="LAYOUT">Diseño (Columnas):</label>
                    <select id="set-cols" onchange="applySettings()" class="w-full border rounded p-2">
                        <option value="2" data-i18n="LAY_2">2 Columnas</option>
                        <option value="1" data-i18n="LAY_1">1 Columna</option>
                    </select>
                </div>
                <div class="flex items-center gap-2 mt-2">
                    <input type="checkbox" id="set-show-bottom" checked onchange="applySettings()" class="w-4 h-4">
                    <label data-i18n="SHOW_BOTTOM">Mostrar Oración y Camisa</label>
                </div>
            </div>
            <button onclick="toggleSettings()" class="w-full bg-gray-800 text-white py-3 font-bold rounded-lg mt-6" data-i18n="CLOSE" type="button">CERRAR</button>
        </div>
    </div>

    <!-- Custom Delete Confirmation Modal -->
    <div id="delete-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-sm p-6 relative text-center">
            <h3 class="font-bold text-lg mb-2 text-red-600" data-i18n="DEL_CONFIRM_TITLE">¿Eliminar plantilla?</h3>
            <p class="text-sm text-gray-600 mb-6" id="delete-modal-name"></p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 bg-gray-200 text-gray-800 py-2.5 font-bold rounded-lg text-sm" data-i18n="BTN_GO_BACK" type="button">VOLVER</button>
                <button onclick="confirmDeleteSaved()" class="flex-1 bg-red-600 text-white py-2.5 font-bold rounded-lg text-sm" data-i18n="BTN_DELETE_CONFIRM" type="button">ELIMINAR</button>
            </div>
        </div>
    </div>

    <nav class="flex border-b border-gray-300 bg-white sticky top-[72px] z-30 overflow-x-auto">
        <button onclick="showTab('crear')" class="tab-btn flex-1 py-3 px-4 text-sm font-semibold border-b-4 border-primary-theme text-primary-theme whitespace-nowrap" id="tab-crear" data-i18n="TAB_CREATE" type="button">CREAR / EDITAR</button>
        <button onclick="showTab('vista')" class="tab-btn flex-1 py-3 px-4 text-sm font-semibold border-b-4 border-transparent text-gray-500 whitespace-nowrap" id="tab-vista" data-i18n="TAB_PREVIEW" type="button">VISTA PREVIA</button>
        <button onclick="showTab('guardados')" class="tab-btn flex-1 py-3 px-4 text-sm font-semibold border-b-4 border-transparent text-gray-500 whitespace-nowrap" id="tab-guardados" data-i18n="TAB_SAVED" type="button">GUARDADOS</button>
    </nav>

    <main class="p-4 max-w-lg mx-auto">
        <div id="crear" class="tab-content active space-y-6">
            <div id="services-container" class="space-y-6"></div>
            <button onclick="addServiceBlock()" class="w-full bg-primary-theme text-white font-bold py-3 rounded-lg shadow-sm mb-4" data-i18n="BTN_ADD_DAY" type="button">+ AGREGAR OTRO DÍA / SERVICIO</button>
            <hr class="border-gray-300">
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 bottom-section-editor">
                <h2 class="font-bold text-primary-theme mb-3" data-i18n="SEC_NOTICE">SECCIÓN DE AVISO / ORACIÓN</h2>
                <label class="block text-xs font-semibold mb-1" data-i18n="BOX_TITLE">Título principal</label>
                <input type="text" id="in-ora-header" class="w-full border rounded p-2 text-sm mb-3" value="ORACIÓN NOCTURNA">
                <label class="block text-xs font-semibold mb-1" data-i18n="SUBTITLE_THEME">Subtítulo / Tema</label>
                <input type="text" id="in-ora-titulo" class="w-full border rounded p-2 text-sm mb-3" value="SEMANA DE AYUNO">
                <label class="block text-xs font-semibold mb-1" data-i18n="DETAILS_TXT">Detalles</label>
                <textarea id="in-ora-dias" class="w-full border rounded p-2 text-sm" rows="4">MARTES MIERCOLES Y JUEVES</textarea>
            </div>
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 bottom-section-editor">
                <h2 class="font-bold text-primary-theme mb-3" data-i18n="SEC_SHIRT">SECCIÓN FOTO / CAMISA</h2>
                <label class="block text-xs font-semibold mb-1" data-i18n="COLOR_TITLE">Color / Título</label>
                <input type="text" id="in-camisa-titulo" class="w-full border rounded p-2 text-sm mb-3" value="CAMISA DOMINGO BLANCA">
                <label class="block text-xs font-semibold mb-1" data-i18n="UPLOAD_PIC">Subir Foto</label>
                <input type="file" id="in-camisa-foto" accept="image/*" class="w-full text-sm">
                <div class="mt-2">
                    <img id="camisa-preview-small" class="h-24 object-contain hidden border rounded">
                </div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow-sm border border-primary-theme border-l-4 mt-8">
                <label class="block text-xs font-bold mb-2" data-i18n="SAVE_NAME">Nombre para guardar</label>
                <div class="flex gap-2">
                    <input type="text" id="save-name" class="flex-1 border rounded p-2 text-sm" placeholder="Ej: Semana 1">
                    <button onclick="saveAnuncio()" class="bg-primary-theme text-white px-4 py-2 rounded font-bold" data-i18n="BTN_SAVE" type="button">GUARDAR</button>
                </div>
            </div>
            <div class="pt-8 pb-4 text-center">
                <button onclick="document.getElementById('logo-upload').click()" class="text-xs text-gray-400 underline" data-i18n="LOAD_LOGO" type="button">Cargar logo (opcional)</button>
                <input type="file" id="logo-upload" accept="image/*" class="hidden" onchange="updateLogo(event)">
            </div>
        </div>

        <div id="vista" class="tab-content">
            <div class="flex flex-col gap-2 mb-4">
                <div class="flex gap-2">
                    <button onclick="exportPNG(this)" class="flex-1 bg-primary-theme text-white py-3 rounded-lg font-bold text-sm shadow-md" data-i18n="BTN_PNG" type="button">GUARDAR PNG</button>
                    <button onclick="exportPDF(this)" class="flex-1 bg-gray-800 text-white py-3 rounded-lg font-bold text-sm shadow-md" data-i18n="BTN_PDF" type="button">GUARDAR PDF</button>
                </div>
                <button onclick="shareWhatsApp(this)" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold text-sm shadow-md flex items-center justify-center gap-2" data-i18n="BTN_WA" type="button">
                    💬 COMPARTIR POR WHATSAPP
                </button>
            </div>
            <div class="overflow-hidden border-2 border-gray-300 rounded-lg shadow-lg bg-gray-200 flex justify-center items-start pt-4 pb-4 w-full h-[70vh] overflow-y-auto" id="preview-wrapper">
                <div id="scale-wrapper" class="relative">
                    <div id="poster-preview">
                        <div class="flex justify-between items-center mb-10 relative">
                            <img src="7007.png" class="logo-img absolute left-0 top-0 rounded-full bg-black object-contain custom-logo" alt="Logo">
                            <div class="flex-1 text-center px-24">
                                <h1 class="poster-header-text" id="poster-main-title">ALABANZA MINISTERIO JERICO</h1>
                            </div>
                            <img src="7007.png" class="logo-img absolute right-0 top-0 rounded-full bg-black object-contain custom-logo" alt="Logo">
                        </div>
                        <div id="out-services-grid" class="grid gap-8 mb-12"></div>
                        <div id="out-bottom-row" class="grid grid-cols-2 gap-8">
                            <div class="poster-box flex flex-col justify-center text-center p-8">
                                <div class="box-title" id="out-ora-header">ORACIÓN NOCTURNA</div>
                                <div class="text-2xl font-bold mb-6" id="out-ora-titulo">SEMANA DE AYUNO</div>
                                <div class="text-xl font-bold text-gray-800 uppercase whitespace-pre-wrap leading-tight" id="out-ora-dias">MARTES MIERCOLES Y JUEVES</div>
                            </div>
                            <div class="poster-box text-center">
                                <div class="box-title" id="out-camisa-titulo">CAMISA DOMINGO BLANCA</div>
                                <div class="h-[250px] mt-4 flex items-center justify-center">
                                    <img id="out-camisa-foto" class="max-h-full max-w-full object-contain" style="display:none;">
                                    <div id="out-camisa-placeholder" class="text-gray-400 font-bold border-2 border-dashed border-gray-300 w-full h-full flex items-center justify-center" data-i18n="PIC_PLACEHOLDER">FOTO DE CAMISA</div>
                                </div>
                            </div>
                        </div>
                        <img src="7007.png" class="bottom-logo rounded-full bg-black object-contain custom-logo" alt="Logo Centro">
                    </div>
                </div>
            </div>
        </div>

        <div id="guardados" class="tab-content">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-4 bg-gray-50 border-b">
                    <h2 class="font-bold text-gray-700" data-i18n="TAB_SAVED">MIS ANUNCIOS GUARDADOS</h2>
                </div>
                <div id="saved-list" class="divide-y divide-gray-100"></div>
            </div>
        </div>
    </main>

    <script>
        window.onerror = function(msg, url, line) {
            const banner = document.getElementById('error-banner');
            if(banner) {
                banner.innerText = "Error: " + msg + " (Line: " + line + ")";
                banner.classList.remove('hidden');
            }
        };

        const translations = {
            es: {
                APP_TITLE: "ALABANZA MINISTERIO JERICO", SUBTITLE: "Creador de anuncios semanales",
                SETTINGS: "Configuración y Diseño", COLOR_THEME: "Color Principal:", COLOR_BG: "Color de Fondo:",
                LANG: "Idioma / Language:", LAYOUT: "Diseño (Columnas):", LAY_2: "2 Columnas", LAY_1: "1 Columna",
                SHOW_BOTTOM: "Mostrar Oración y Camisa", CLOSE: "CERRAR", TAB_CREATE: "CREAR / EDITAR",
                TAB_PREVIEW: "VISTA PREVIA", TAB_SAVED: "GUARDADOS", BTN_ADD_DAY: "+ AGREGAR OTRO DÍA / SERVICIO",
                BTN_ADD_ROLE: "+ Agregar Puesto", BTN_DEL_DAY: "Eliminar Día", SEC_NOTICE: "SECCIÓN DE AVISO / ORACIÓN",
                BOX_TITLE: "Título principal", SUBTITLE_THEME: "Subtítulo / Tema", DETAILS_TXT: "Detalles",
                SEC_SHIRT: "SECCIÓN FOTO / CAMISA", COLOR_TITLE: "Título superior", UPLOAD_PIC: "Subir Foto",
                SAVE_NAME: "Nombre para guardar", BTN_SAVE: "GUARDAR", LOAD_LOGO: "Cargar logo (opcional)",
                BTN_PNG: "GUARDAR PNG", BTN_PDF: "GUARDAR PDF", BTN_WA: "💬 COMPARTIR POR WHATSAPP",
                PIC_PLACEHOLDER: "FOTO DE CAMISA", LBL_DATE: "Fecha:", LBL_TIME: "Hora:",
                BTN_NEXT_FRI: "📅 Próximo Viernes", BTN_NEXT_SUN: "📅 Próximo Domingo",
                DEL_CONFIRM_TITLE: "¿Eliminar plantilla?", BTN_DELETE_CONFIRM: "ELIMINAR", BTN_GO_BACK: "VOLVER"
            },
            en: {
                APP_TITLE: "JERICHO WORSHIP MINISTRY", SUBTITLE: "Weekly Announcement Maker",
                SETTINGS: "Settings & Design", COLOR_THEME: "Primary Color:", COLOR_BG: "Background Color:",
                LANG: "Idioma / Language:", LAYOUT: "Services Layout (Columns):", LAY_2: "2 Columns", LAY_1: "1 Column",
                SHOW_BOTTOM: "Show Prayer and Shirt sections", CLOSE: "CLOSE", TAB_CREATE: "CREATE / EDIT",
                TAB_PREVIEW: "PREVIEW", TAB_SAVED: "SAVED", BTN_ADD_DAY: "+ ADD ANOTHER DAY / SERVICE",
                BTN_ADD_ROLE: "+ Add Role/Person", BTN_DEL_DAY: "Delete Day", SEC_NOTICE: "NOTICE / PRAYER SECTION",
                BOX_TITLE: "Main Title", SUBTITLE_THEME: "Subtitle / Theme", DETAILS_TXT: "Details",
                SEC_SHIRT: "PHOTO / SHIRT SECTION", COLOR_TITLE: "Top Title", UPLOAD_PIC: "Upload Photo",
                SAVE_NAME: "Name to save template", BTN_SAVE: "SAVE", LOAD_LOGO: "Load custom logo (optional)",
                BTN_PNG: "SAVE PNG", BTN_PDF: "SAVE PDF", BTN_WA: "💬 SHARE VIA WHATSAPP",
                PIC_PLACEHOLDER: "SHIRT PHOTO", LBL_DATE: "Date:", LBL_TIME: "Time:",
                BTN_NEXT_FRI: "📅 Next Friday", BTN_NEXT_SUN: "📅 Next Sunday",
                DEL_CONFIRM_TITLE: "Delete Template?", BTN_DELETE_CONFIRM: "DELETE", BTN_GO_BACK: "GO BACK"
            }
        };

        const defaultRoles = ["PRESIDE", "SEGUNDA VOZ", "CORO 1", "CORO 2", "CORO 3", "CORO 4", "PIANO 1", "PIANO 2", "BATERÍA"];
        
        let customLogoDataUrl = null;
        let serviceCounter = 0;
        let targetDeleteName = null;

        function initApp() {
            try {
                loadSettings();
                addServiceBlock('SERVICIO VIERNES', getNextDate(5), '6:30 PM', defaultRoles);
                addServiceBlock('SERVICIO DOMINGO', getNextDate(0), '9:00 AM', defaultRoles);

                document.addEventListener('input', function(e) {
                    updatePreview();
                    if(e.target.classList.contains('role-person-input')) {
                        saveTeamMember(e.target.value);
                    }
                });

                const fileInput = document.getElementById('in-camisa-foto');
                if (fileInput) {
                    fileInput.addEventListener('change', function(e) {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function(event) {
                                const imgDataUrl = event.target.result;
                                document.getElementById('camisa-preview-small').src = imgDataUrl;
                                document.getElementById('camisa-preview-small').classList.remove('hidden');
                                document.getElementById('out-camisa-foto').src = imgDataUrl;
                                document.getElementById('out-camisa-foto').style.display = 'block';
                                document.getElementById('out-camisa-placeholder').style.display = 'none';
                                document.getElementById('in-camisa-foto').dataset.base64 = imgDataUrl;
                            }
                            reader.readAsDataURL(file);
                        }
                    });
                }
                loadTeamDirectory();
                renderSavedList();
                updatePreview();
                window.addEventListener('resize', scalePreview);
            } catch (err) {
                console.error(err);
                document.getElementById('error-banner').innerText = "Init Error: " + err.message;
                document.getElementById('error-banner').classList.remove('hidden');
            }
        }

        function getNextDate(targetDay) {
            const d = new Date();
            const day = d.getDay();
            const distance = (targetDay + 7 - day) % 7;
            d.setDate(d.getDate() + (distance === 0 ? 7 : distance));
            const dayNum = String(d.getDate()).padStart(2, '0');
            const monthNum = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${dayNum}/${monthNum}/${year}`;
        }

        function saveTeamMember(name) {
            const cleanName = name.trim();
            if(!cleanName || cleanName.length < 2) return;
            try {
                let list = JSON.parse(localStorage.getItem('jerico-team') || '[]');
                if(!list.includes(cleanName)) {
                    list.push(cleanName);
                    localStorage.setItem('jerico-team', JSON.stringify(list));
                    loadTeamDirectory();
                }
            } catch(e) {}
        }

        function loadTeamDirectory() {
            try {
                let list = JSON.parse(localStorage.getItem('jerico-team') || '[]');
                const datalist = document.getElementById('team-directory-list');
                datalist.innerHTML = '';
                list.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    datalist.appendChild(opt);
                });
            } catch(e) {}
        }

        function addServiceBlock(title = 'NUEVO SERVICIO', date = '', time = '', roles = []) {
            const sId = 'srv_' + (serviceCounter++);
            const container = document.getElementById('services-container');
            const currentLang = document.getElementById('set-lang').value || 'es';
            const t = translations[currentLang];

            const div = document.createElement('div');
            div.className = 'service-editor-block bg-white p-4 rounded-lg shadow-sm border border-gray-200';
            div.id = sId;

            let html = `
                <div class="flex justify-between items-center mb-3">
                    <input type="text" class="srv-title font-bold text-primary-theme text-lg border-b border-dashed border-gray-400 bg-transparent focus:outline-none w-2/3" value="${title}" placeholder="TÍTULO">
                    <button onclick="document.getElementById('${sId}').remove(); updatePreview();" class="text-red-500 text-xs font-bold bg-red-50 px-2 py-1 rounded" type="button">${t.BTN_DEL_DAY}</button>
                </div>
                <div class="grid grid-cols-2 gap-4 mb-3 bg-gray-50 p-2 rounded border">
                    <div>
                        <label class="block text-xs font-semibold mb-1 srv-lbl-date">${t.LBL_DATE}</label>
                        <input type="text" class="srv-date w-full border rounded p-1.5 text-sm" value="${date}" placeholder="Ej: 10/06/2026">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 srv-lbl-time">${t.LBL_TIME}</label>
                        <input type="text" class="srv-time w-full border rounded p-1.5 text-sm" value="${time}" placeholder="Ej: 6:30 PM">
                    </div>
                </div>
                <div class="flex gap-2 mb-4">
                    <button onclick="setBlockDate('${sId}', 5)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-[11px] font-semibold px-2 py-1 rounded srv-btn-fri" type="button">${t.BTN_NEXT_FRI}</button>
                    <button onclick="setBlockDate('${sId}', 0)" class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-[11px] font-semibold px-2 py-1 rounded srv-btn-sun" type="button">${t.BTN_NEXT_SUN}</button>
                </div>
                <div class="roles-container space-y-2 mb-3"></div>
                <div><button onclick="addRoleToBlock('${sId}')" class="bg-primary-theme text-white text-xs px-3 py-1.5 rounded font-bold srv-btn-add" type="button">${t.BTN_ADD_ROLE}</button></div>
            `;
            div.innerHTML = html;
            container.appendChild(div);

            const rolesContainer = div.querySelector('.roles-container');
            if(roles.length === 0) {
                appendRoleRow(rolesContainer, 'PUESTO', '');
            } else {
                roles.forEach(role => {
                    let rName = typeof role === 'string' ? role : role.role;
                    let pName = typeof role === 'string' ? '' : role.person;
                    appendRoleRow(rolesContainer, rName, pName);
                });
            }
            updatePreview();
        }

        function setBlockDate(blockId, targetDay) {
            const block = document.getElementById(blockId);
            if(block) {
                const dateInput = block.querySelector('.srv-date');
                if(dateInput) {
                    dateInput.value = getNextDate(targetDay);
                    updatePreview();
                }
            }
        }

        function addRoleToBlock(blockId) {
            const block = document.getElementById(blockId);
            if (block) {
                const rolesContainer = block.querySelector('.roles-container');
                if (rolesContainer) {
                    appendRoleRow(rolesContainer, 'PUESTO', '');
                }
            }
        }

        function appendRoleRow(container, roleName, personName) {
            const row = document.createElement('div');
            row.className = 'flex items-center gap-2 role-row';
            row.innerHTML = `
                <input type="text" class="role-name-input w-[100px] sm:w-32 border border-gray-300 rounded p-1.5 text-[10px] sm:text-xs font-bold uppercase bg-gray-100" value="${roleName}" placeholder="Rol">
                <input type="text" list="team-directory-list" class="role-person-input flex-1 border border-gray-300 rounded p-1.5 text-sm" value="${personName}" placeholder="Nombre">
                <button onclick="this.parentElement.remove(); updatePreview();" class="text-red-500 font-bold px-2 py-1 text-xs bg-red-50 rounded border border-red-100" type="button">X</button>
            `;
            container.appendChild(row);
            updatePreview();
        }

        function updatePreview() {
            try {
                const grid = document.getElementById('out-services-grid');
                grid.innerHTML = '';
                
                const cols = document.getElementById('set-cols').value;
                grid.className = 'grid gap-8 mb-12 ' + (cols === '2' ? 'grid-cols-2' : 'grid-cols-1');

                const blocks = document.querySelectorAll('.service-editor-block');
                blocks.forEach(block => {
                    const title = block.querySelector('.srv-title').value;
                    const date = block.querySelector('.srv-date').value || 'FECHA';
                    const time = block.querySelector('.srv-time').value || 'HORA';
                    
                    let listHtml = '';
                    block.querySelectorAll('.role-row').forEach(row => {
                        const rName = row.querySelector('.role-name-input').value;
                        const pName = row.querySelector('.role-person-input').value;
                        if (pName.trim() !== '') {
                            listHtml += '<li><span class="role-label">• ' + rName + ':</span> <span class="role-value">' + pName + '</span></li>';
                            saveTeamMember(pName);
                        }
                    });

                    const colDiv = document.createElement('div');
                    colDiv.className = 'flex flex-col gap-6 h-full';
                    colDiv.innerHTML = `
                        <div class="date-box">
                            <div class="text-sm font-bold text-gray-500 mb-1 tracking-widest">FECHA Y HORA</div>
                            <div class="text-2xl font-bold">${date}</div>
                            <div class="text-2xl font-bold">${time}</div>
                        </div>
                        <div class="poster-box flex-1">
                            <div class="box-title">${title}</div>
                            <ul class="role-list">${listHtml}</ul>
                        </div>
                    `;
                    grid.appendChild(colDiv);
                });

                document.getElementById('out-ora-header').innerText = document.getElementById('in-ora-header').value || '';
                document.getElementById('out-ora-titulo').innerText = document.getElementById('in-ora-titulo').value || '';
                document.getElementById('out-ora-dias').innerText = document.getElementById('in-ora-dias').value || '';
                document.getElementById('out-camisa-titulo').innerText = document.getElementById('in-camisa-titulo').value || '';
                
                setTimeout(scalePreview, 20);
            } catch (e) {
                console.error("Preview error", e);
            }
        }

        function scalePreview() {
            const wrapper = document.getElementById('preview-wrapper');
            const scaleWrapper = document.getElementById('scale-wrapper');
            const poster = document.getElementById('poster-preview');
            if(!wrapper || !poster || poster.offsetWidth === 0) return;
            const scale = (wrapper.clientWidth - 24) / 1000; 
            poster.style.transform = 'scale(' + scale + ')';
            if (scaleWrapper) {
                scaleWrapper.style.width = (1000 * scale) + 'px';
                scaleWrapper.style.height = (poster.offsetHeight * scale) + 'px';
            }
        }

        function toggleSettings() {
            document.getElementById('settings-modal').classList.toggle('hidden');
        }

        function applySettings() {
            const primary = document.getElementById('set-primary').value;
            const bg = document.getElementById('set-bg').value;
            const lang = document.getElementById('set-lang').value;
            const cols = document.getElementById('set-cols').value;
            const showBottom = document.getElementById('set-show-bottom').checked;

            document.documentElement.style.setProperty('--primary', primary);
            document.documentElement.style.setProperty('--bg', bg);

            const t = translations[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    if (el.tagName === 'INPUT' && el.type !== 'button') el.placeholder = t[key];
                    else el.innerText = t[key];
                }
            });
            document.getElementById('app-title').innerText = t.APP_TITLE;
            
            document.querySelectorAll('.srv-lbl-date').forEach(el => el.innerText = t.LBL_DATE);
            document.querySelectorAll('.srv-lbl-time').forEach(el => el.innerText = t.LBL_TIME);
            document.querySelectorAll('.srv-btn-add').forEach(el => el.innerText = t.BTN_ADD_ROLE);
            document.querySelectorAll('.srv-btn-fri').forEach(el => el.innerText = t.BTN_NEXT_FRI);
            document.querySelectorAll('.srv-btn-sun').forEach(el => el.innerText = t.BTN_NEXT_SUN);

            const bottomRow = document.getElementById('out-bottom-row');
            const bottomEditors = document.querySelectorAll('.bottom-section-editor');
            if(showBottom) {
                bottomRow.style.display = 'grid';
                bottomEditors.forEach(el => el.style.display = 'block');
            } else {
                bottomRow.style.display = 'none';
                bottomEditors.forEach(el => el.style.display = 'none');
            }

            try {
                localStorage.setItem('jerico-settings', JSON.stringify({primary: primary, bg: bg, lang: lang, cols: cols, showBottom: showBottom}));
            } catch(e) {}
            
            updatePreview();
        }

        function loadSettings() {
            try {
                const storedRaw = localStorage.getItem('jerico-settings');
                if(storedRaw) {
                    const stored = JSON.parse(storedRaw);
                    document.getElementById('set-primary').value = stored.primary || '#8b5a2b';
                    document.getElementById('set-bg').value = stored.bg || '#fdfbf7';
                    document.getElementById('set-lang').value = stored.lang || 'es';
                    document.getElementById('set-cols').value = stored.cols || '2';
                    document.getElementById('set-show-bottom').checked = stored.showBottom !== false;
                }
            } catch(e) {}
            applySettings();
        }
        
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-primary-theme', 'text-primary-theme');
                el.classList.add('border-transparent', 'text-gray-500');
            });
            
            document.getElementById(tabId).classList.add('active');
            const tabBtn = document.getElementById('tab-' + tabId);
            tabBtn.classList.remove('border-transparent', 'text-gray-500');
            tabBtn.classList.add('border-primary-theme', 'text-primary-theme');

            if(tabId === 'vista') {
                updatePreview();
            }
        }

        function getFormData() {
            let services = [];
            document.querySelectorAll('.service-editor-block').forEach(block => {
                let roles = [];
                block.querySelectorAll('.role-row').forEach(row => {
                    roles.push({
                        role: row.querySelector('.role-name-input').value,
                        person: row.querySelector('.role-person-input').value
                    });
                });
                services.push({
                    title: block.querySelector('.srv-title').value,
                    date: block.querySelector('.srv-date').value,
                    time: block.querySelector('.srv-time').value,
                    roles: roles
                });
            });

            return {
                services: services,
                oraHeader: document.getElementById('in-ora-header').value,
                oraTitulo: document.getElementById('in-ora-titulo').value,
                oraDias: document.getElementById('in-ora-dias').value,
                camisaTitulo: document.getElementById('in-camisa-titulo').value,
                camisaImg: document.getElementById('in-camisa-foto').dataset.base64 || null
            };
        }

        function loadFormData(data) {
            try {
                document.getElementById('services-container').innerHTML = '';
                
                if (data.services && data.services.length > 0) {
                    data.services.forEach(s => addServiceBlock(s.title, s.date, s.time, s.roles));
                } else {
                    let vRoles = data.viernes || [];
                    let dRoles = data.domingo || [];
                    addServiceBlock('SERVICIO VIERNES', data.vFecha || '', data.vHora || '6:30 PM', vRoles);
                    addServiceBlock('SERVICIO DOMINGO', data.dFecha || '', data.dHora || '9:00 AM', dRoles);
                }

                document.getElementById('in-ora-header').value = data.oraHeader || 'ORACIÓN NOCTURNA';
                document.getElementById('in-ora-titulo').value = data.oraTitulo || '';
                document.getElementById('in-ora-dias').value = data.oraDias || '';
                document.getElementById('in-camisa-titulo').value = data.camisaTitulo || '';
                
                if (data.camisaImg) {
                    document.getElementById('camisa-preview-small').src = data.camisaImg;
                    document.getElementById('camisa-preview-small').classList.remove('hidden');
                    document.getElementById('out-camisa-foto').src = data.camisaImg;
                    document.getElementById('out-camisa-foto').style.display = 'block';
                    document.getElementById('out-camisa-placeholder').style.display = 'none';
                    document.getElementById('in-camisa-foto').dataset.base64 = data.camisaImg;
                } else {
                    document.getElementById('camisa-preview-small').classList.add('hidden');
                    document.getElementById('out-camisa-foto').style.display = 'none';
                    document.getElementById('out-camisa-placeholder').style.display = 'flex';
                    document.getElementById('in-camisa-foto').dataset.base64 = '';
                }
                
                updatePreview();
                showTab('crear');
            } catch(e) {
                alert("Error cargando plantilla: " + e.message);
            }
        }

        function saveAnuncio() {
            const name = document.getElementById('save-name').value.trim();
            if (!name) return alert("Por favor, ingresa un nombre para guardar.");
            
            try {
                const savedRaw = localStorage.getItem('jerico-anuncios');
                const savedList = savedRaw ? JSON.parse(savedRaw) : {};
                savedList[name] = { date: new Date().toLocaleDateString(), data: getFormData() };
                localStorage.setItem('jerico-anuncios', JSON.stringify(savedList));
                
                alert("Plantilla guardada / Template Saved.");
                document.getElementById('save-name').value = '';
                renderSavedList();
            } catch(e) {
                alert("Error al guardar: " + e.message);
            }
        }

        function renderSavedList() {
            const listDiv = document.getElementById('saved-list');
            try {
                const savedRaw = localStorage.getItem('jerico-anuncios');
                const savedList = savedRaw ? JSON.parse(savedRaw) : {};
                
                if (Object.keys(savedList).length === 0) {
                    listDiv.innerHTML = '<div class="p-8 text-center text-gray-400 text-sm">No hay anuncios guardados.</div>';
                    return;
                }
                
                let html = '';
                for (const name in savedList) {
                    const item = savedList[name];
                    html += `
                        <div class="p-4 hover:bg-gray-50 flex justify-between items-center gap-4">
                            <div class="flex-1 overflow-hidden">
                                <h3 class="font-bold text-sm truncate">${name}</h3>
                                <p class="text-xs text-gray-500">${item.date}</p>
                            </div>
                            <div class="flex gap-2 shrink-0">
                                <button onclick="loadSaved('${name}')" class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-xs font-bold" type="button">ABRIR</button>
                                <button onclick="deleteSaved('${name}')" class="bg-red-100 text-red-700 px-3 py-1 rounded text-xs font-bold" type="button">X</button>
                            </div>
                        </div>
                    `;
                }
                listDiv.innerHTML = html;
            } catch(e) {
                listDiv.innerHTML = '<div class="p-8 text-center text-red-400 text-sm">Error cargando guardados.</div>';
            }
        }

        function loadSaved(name) {
            try {
                const savedRaw = localStorage.getItem('jerico-anuncios');
                const savedList = savedRaw ? JSON.parse(savedRaw) : {};
                if(savedList[name]) loadFormData(savedList[name].data);
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        function deleteSaved(name) {
            targetDeleteName = name;
            document.getElementById('delete-modal-name').innerText = `"${name}"`;
            document.getElementById('delete-modal').classList.remove('hidden');
        }

        function closeDeleteModal() {
            targetDeleteName = null;
            document.getElementById('delete-modal').classList.add('hidden');
        }

        function confirmDeleteSaved() {
            if (!targetDeleteName) return;
            try {
                const savedRaw = localStorage.getItem('jerico-anuncios');
                const savedList = savedRaw ? JSON.parse(savedRaw) : {};
                delete savedList[targetDeleteName];
                localStorage.setItem('jerico-anuncios', JSON.stringify(savedList));
                closeDeleteModal();
                renderSavedList();
            } catch(e) {
                alert("Error: " + e.message);
            }
        }

        function updateLogo(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    customLogoDataUrl = event.target.result;
                    document.querySelectorAll('.custom-logo').forEach(img => img.src = customLogoDataUrl);
                }
                reader.readAsDataURL(file);
            }
        }

        async function prepareForExport() {
            updatePreview();
            const poster = document.getElementById('poster-preview');
            poster.style.transform = 'scale(1)';
            
            const canvas = await html2canvas(poster, {
                scale: 2,
                useCORS: true,
                backgroundColor: document.getElementById('set-bg').value
            });
            
            scalePreview();
            return canvas;
        }

        async function exportPNG(btn) {
            try {
                const originalText = btn.innerText;
                btn.innerText = "GENERANDO...";
                
                const canvas = await prepareForExport();
                const a = document.createElement('a');
                a.href = canvas.toDataURL("image/png", 1.0);
                a.download = "Jerico_" + new Date().getTime() + ".png";
                a.click();
                
                btn.innerText = originalText;
            } catch (err) {
                alert("Error al exportar PNG: " + err.message);
            }
        }

        async function exportPDF(btn) {
            try {
                const originalText = btn.innerText;
                btn.innerText = "GENERANDO PDF...";
                
                const canvas = await prepareForExport();
                const imgData = canvas.toDataURL('image/jpeg', 0.9);
                
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                
                pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                pdf.save("Jerico_" + new Date().getTime() + ".pdf");
                
                btn.innerText = originalText;
            } catch (err) {
                alert("Error al exportar PDF: " + err.message);
            }
        }

        async function shareWhatsApp(btn) {
            try {
                const originalText = btn.innerText;
                btn.innerText = "PREPARANDO WHATSAPP...";
                
                const canvas = await prepareForExport();
                
                canvas.toBlob(async function(blob) {
                    const file = new File([blob], "Anuncio_Jerico.png", { type: "image/png" });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                title: 'Anuncio Alabanza',
                                text: '¡Hola! Aquí está el programa y anuncio del ministerio de alabanza.',
                                files: [file]
                            });
                            btn.innerText = originalText;
                            return;
                        } catch (err) {
                            if (err.name !== 'AbortError') {
                                console.warn("Share API error:", err);
                            }
                        }
                    }
                    
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = "Jerico_WhatsApp.png";
                    a.click();
                    
                    window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent("¡Hola equipo! Aquí adjunto la imagen del programa de alabanza. (La imagen se ha descargado a tu dispositivo para adjuntarla)."), '_blank');
                    
                    btn.innerText = originalText;
                }, 'image/png');
            } catch (err) {
                alert("Error al compartir: " + err.message);
                btn.innerText = "💬 COMPARTIR POR WHATSAPP";
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
